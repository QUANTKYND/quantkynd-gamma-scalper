services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quantkynd
      POSTGRES_PASSWORD: quantkynd_local
      POSTGRES_DB: quantkynd_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quantkynd-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantkynd -d quantkynd_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  quantkynd-postgres-data:

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28,<1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.52.1",
    "upstox-python-sdk>=2.28,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "ijson>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
